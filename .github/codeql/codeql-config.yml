name: "Comandas CodeQL config"

paths:
  - "backend"
  - "frontend/src"
  - "frontend/package.json"
  - "frontend/vite.config.ts"
  - "frontend/tsconfig*.json"
  - "frontend/postcss.config.js"
  - "frontend/tailwind.config.ts"
  - "frontend/components.json"
  - "frontend/bunfig.toml"

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/alembic/**"
  - "**/docs/**"
  - "**/scripts/**"
  - "**/image/**"
  - "**/public/**"
  - "**/*.min.js"
  - "**/*.test.*"
  - "**/*.spec.*"
